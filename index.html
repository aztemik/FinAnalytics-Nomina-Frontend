<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinAnalytics OS · Iniciar sesion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="pagina-login d-flex align-items-center">
  <div id="alertas"></div>

  <main class="container" style="max-width: 380px;">
    <div class="card shadow">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-1">FinAnalytics OS</h1>
        <p class="text-center text-muted mb-4">Modulo de Nomina y Seguridad</p>

        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input type="text" id="username" class="form-control" autocomplete="username">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contrasena</label>
          <input type="password" id="password" class="form-control" autocomplete="current-password">
        </div>
        <button type="button" id="btnEntrar" class="btn btn-teal w-100" onclick="entrar()">Entrar</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
