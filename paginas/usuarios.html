<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinAnalytics OS · Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <div id="alertas"></div>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Usuarios</h1>
      <button type="button" class="btn btn-teal" data-bs-toggle="modal" data-bs-target="#modalAlta">Nuevo usuario</button>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Nombre completo</th>
            <th>Rol</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbodyUsuarios"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal: alta -->
  <div class="modal fade" id="modalAlta" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nuevo usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="altaUsername" class="form-label">Usuario</label>
            <input type="text" id="altaUsername" class="form-control">
            <div class="invalid-feedback">4 a 50 caracteres, sin espacios.</div>
          </div>
          <div class="mb-3">
            <label for="altaPassword" class="form-label">Contrasena inicial</label>
            <input type="password" id="altaPassword" class="form-control">
            <div class="invalid-feedback">Minimo 8 caracteres, una mayuscula y un numero.</div>
          </div>
          <div class="mb-3">
            <label for="altaNombre" class="form-label">Nombre completo</label>
            <input type="text" id="altaNombre" class="form-control">
            <div class="invalid-feedback">Requerido.</div>
          </div>
          <div class="mb-3">
            <label for="altaRol" class="form-label">Rol</label>
            <select id="altaRol" class="form-select"></select>
            <div class="invalid-feedback">Selecciona un rol.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-teal" onclick="crearUsuario()">Crear</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: editar -->
  <div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editarId">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" id="editarUsername" class="form-control" disabled>
          </div>
          <div class="mb-3">
            <label for="editarNombre" class="form-label">Nombre completo</label>
            <input type="text" id="editarNombre" class="form-control">
            <div class="invalid-feedback">Requerido.</div>
          </div>
          <div class="mb-3">
            <label for="editarRol" class="form-label">Rol</label>
            <select id="editarRol" class="form-select"></select>
          </div>
          <div class="form-check mb-3">
            <input type="checkbox" id="editarActivo" class="form-check-input">
            <label for="editarActivo" class="form-check-label">Activo</label>
          </div>
          <div class="mb-3">
            <label for="editarPassword" class="form-label">Nueva contrasena</label>
            <input type="password" id="editarPassword" class="form-control" placeholder="Dejar en blanco para no cambiarla">
            <div class="invalid-feedback">Minimo 8 caracteres, una mayuscula y un numero.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-teal" onclick="guardarEdicion()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/usuarios.js"></script>
</body>
</html>
