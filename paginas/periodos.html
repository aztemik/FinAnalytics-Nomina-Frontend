<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinAnalytics OS · Periodos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <div id="alertas"></div>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Periodos de nomina</h1>
      <button type="button" id="btnNuevo" class="btn btn-teal" onclick="abrirNuevo()">Nuevo periodo</button>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white">
        <thead>
          <tr>
            <th>Descripcion</th>
            <th>Fechas</th>
            <th>Estado</th>
            <th>Total neto</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbodyPeriodos"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal: alta / edicion -->
  <div class="modal fade" id="modalPeriodo" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalPeriodoTitulo">Nuevo periodo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="campoId">
          <div class="mb-3">
            <label for="campoDescripcion" class="form-label">Descripcion</label>
            <input type="text" id="campoDescripcion" class="form-control" placeholder="Ej. Primera quincena de agosto 2026">
            <div class="invalid-feedback">Requerido.</div>
          </div>
          <div class="mb-3">
            <label for="campoFechaInicio" class="form-label">Fecha de inicio</label>
            <input type="date" id="campoFechaInicio" class="form-control">
            <div class="invalid-feedback">Requerido.</div>
          </div>
          <div class="mb-3">
            <label for="campoFechaFin" class="form-label">Fecha de fin</label>
            <input type="date" id="campoFechaFin" class="form-control">
            <div class="invalid-feedback">Debe ser posterior a la fecha de inicio.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-teal" onclick="guardarPeriodo()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/periodos.js"></script>
</body>
</html>
