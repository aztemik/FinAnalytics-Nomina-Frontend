<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinAnalytics OS · Recibo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <div id="alertas"></div>

  <main class="container">
    <a href="#" id="enlaceVolver" class="d-inline-block mb-3">&larr; Volver</a>

    <div class="card mb-4">
      <div class="card-body">
        <h1 class="h4 mb-1" id="nombreEmpleado"></h1>
        <p class="text-muted mb-3">N&deg; empleado: <span id="numeroEmpleado"></span> &middot; Periodo #<span id="periodoId"></span></p>

        <div class="row text-center g-3">
          <div class="col-6 col-md-3">
            <div class="text-muted small">Sueldo base</div>
            <div class="fs-5" id="sueldoBase"></div>
          </div>
          <div class="col-6 col-md-3">
            <div class="text-muted small">Percepciones</div>
            <div class="fs-5" id="totalPercepciones"></div>
          </div>
          <div class="col-6 col-md-3">
            <div class="text-muted small">Deducciones</div>
            <div class="fs-5" id="totalDeducciones"></div>
          </div>
          <div class="col-6 col-md-3">
            <div class="text-muted small">Neto a pagar</div>
            <div class="fs-5 fw-bold" id="totalNeto"></div>
          </div>
        </div>

        <div id="bloqueTipoCambio" class="mt-3 pt-3 border-top d-none">
          <span class="text-muted small">Tipo de cambio USD aplicado en este periodo:</span>
          <strong id="tipoCambioValor"></strong>
          <span id="tipoCambioFuente"></span>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <h2 class="h6">Percepciones</h2>
        <table class="table table-sm bg-white">
          <tbody id="tbodyPercepciones"></tbody>
        </table>
      </div>
      <div class="col-md-6">
        <h2 class="h6">Deducciones</h2>
        <table class="table table-sm bg-white">
          <tbody id="tbodyDeducciones"></tbody>
        </table>
      </div>
    </div>

    <div id="bloquePatronal" class="mt-4 d-none">
      <h2 class="h6">Carga patronal <span class="text-muted small">(costo de la empresa, no afecta el neto del empleado)</span></h2>
      <table class="table table-sm bg-white">
        <tbody id="tbodyPatronal"></tbody>
      </table>
      <p class="text-end fw-bold">Total carga patronal: <span id="totalCargaPatronal"></span></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/recibo.js"></script>
</body>
</html>
