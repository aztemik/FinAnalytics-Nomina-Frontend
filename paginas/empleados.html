<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinAnalytics OS · Empleados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <div id="alertas"></div>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Empleados</h1>
      <button type="button" id="btnNuevo" class="btn btn-teal" onclick="abrirNuevo()">Nuevo empleado</button>
    </div>

    <input type="text" id="buscador" class="form-control mb-3" placeholder="Buscar por numero, nombre o RFC..." oninput="filtrar()">

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white">
        <thead>
          <tr>
            <th>N° Empleado</th>
            <th>Nombre</th>
            <th>RFC</th>
            <th>Tipo</th>
            <th>Salario mensual</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbodyEmpleados"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal: alta / edicion -->
  <div class="modal fade" id="modalEmpleado" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalEmpleadoTitulo">Nuevo empleado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="campoId">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="campoNumeroEmpleado" class="form-label">Numero de empleado</label>
              <input type="text" id="campoNumeroEmpleado" class="form-control">
              <div class="invalid-feedback">Requerido, maximo 20 caracteres.</div>
            </div>
            <div class="col-md-6">
              <label for="campoRfc" class="form-label">RFC</label>
              <input type="text" id="campoRfc" class="form-control text-uppercase">
              <div class="invalid-feedback">Formato de RFC no valido.</div>
            </div>
            <div class="col-md-6">
              <label for="campoNombre" class="form-label">Nombre</label>
              <input type="text" id="campoNombre" class="form-control">
              <div class="invalid-feedback">Requerido.</div>
            </div>
            <div class="col-md-6">
              <label for="campoApellidos" class="form-label">Apellidos</label>
              <input type="text" id="campoApellidos" class="form-control">
              <div class="invalid-feedback">Requerido.</div>
            </div>
            <div class="col-md-6">
              <label for="campoPuesto" class="form-label">Puesto</label>
              <input type="text" id="campoPuesto" class="form-control">
            </div>
            <div class="col-md-6">
              <label for="campoDepartamento" class="form-label">Departamento</label>
              <input type="text" id="campoDepartamento" class="form-control">
            </div>
            <div class="col-md-6">
              <label for="campoTipoContratacion" class="form-label">Tipo de contratacion</label>
              <select id="campoTipoContratacion" class="form-select" onchange="actualizarVisibilidadMoneda()">
                <option value="NOMINA">NOMINA</option>
                <option value="HONORARIOS">HONORARIOS</option>
              </select>
            </div>
            <div class="col-md-6 d-none" id="grupoMoneda">
              <label for="campoMoneda" class="form-label">Moneda</label>
              <select id="campoMoneda" class="form-select">
                <option value="MXN">MXN</option>
                <option value="USD">USD</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="campoSalario" class="form-label">Salario mensual</label>
              <input type="number" step="0.01" min="0.01" id="campoSalario" class="form-control">
              <div class="invalid-feedback">Debe ser mayor a 0.</div>
            </div>
            <div class="col-md-6">
              <label for="campoFechaIngreso" class="form-label">Fecha de ingreso</label>
              <input type="date" id="campoFechaIngreso" class="form-control">
              <div class="invalid-feedback">No puede ser una fecha futura.</div>
            </div>
            <div class="col-md-12">
              <label for="campoUsuarioId" class="form-label">Cuenta de portal vinculada</label>
              <select id="campoUsuarioId" class="form-select">
                <option value="">Sin vincular</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-teal" onclick="guardarEmpleado()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/empleados.js"></script>
</body>
</html>
